[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hi_fast"
version = "0.1.0"
authors = [{name="Emilio Bellini"}]
description = "Fast emulation interface for HiCLASS cosmological observables"
requires-python = ">=3.10,<3.14"
dependencies = [
    "astropy",
    "numpy>=2.0",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "scipy>=1.15",
    "tensorflow>=2.18",
    "hiclassy>3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[project.urls]
Homepage = "https://github.com/emiliobellini/hi_fast"
Documentation = "https://github.com/emiliobellini/hi_fast/README.md"
Source = "https://github.com/emiliobellini/hi_fast"
Tracker = "https://github.com/emiliobellini/hi_fast/issues"
Licensing = "https://github.com/emiliobellini/hi_fast/LICENSE"
